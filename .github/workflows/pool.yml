name: Tatoeba audio pool
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pool.trigger, picks.txt, .github/workflows/pool.yml]
permissions:
  contents: write
jobs:
  pool:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
      - run: python3 -m pip install --quiet opencc-python-reimplemented
      - name: Build pool / download picks
        working-directory: repo
        run: |
          python3 - <<'PY'
          import bz2, csv, io, os, tarfile, time, urllib.request
          import opencc
          UA={"User-Agent":"chinese-audio-study/1.0 (personal study)"}
          BASE="https://downloads.tatoeba.org/exports"
          def get(url,tries=3):
              for i in range(tries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=180) as r: return r.read()
                  except Exception as e:
                      print("retry",url,e,flush=True); time.sleep(3*(i+1))
              return None
          if not os.path.exists("pool.tsv"):
              t2s=opencc.OpenCC("t2s")
              raw=bz2.decompress(get(BASE+"/per_language/cmn/cmn_sentences.tsv.bz2")).decode()
              cmn={}
              for line in raw.splitlines():
                  p=line.split("\t")
                  if len(p)>=3: cmn[p[0]]=p[2]
              tf=tarfile.open(fileobj=io.BytesIO(get(BASE+"/sentences_with_audio.tar.bz2")),mode="r:bz2")
              m=[x for x in tf.getmembers() if x.name.endswith(".csv")][0]
              rows=[];seen=set()
              for line in tf.extractfile(m).read().decode().splitlines():
                  p=line.split("\t")
                  if not p or p[0] not in cmn or p[0] in seen: continue
                  t=cmn[p[0]];han=[c for c in t if "一"<=c<="鿿"]
                  if not (3<=len(han)<=20) or t2s.convert(t)!=t: continue
                  seen.add(p[0]);rows.append([p[0],t]+(p[1:]+["","","",""])[:4])
              with open("pool.tsv","w",newline="") as f:
                  w=csv.writer(f,delimiter="\t");w.writerow(["id","text","audio_id","username","license","attribution"]);w.writerows(rows)
              print("pool",len(rows),flush=True)
          if os.path.exists("picks.txt"):
              pool={r["id"]:r for r in csv.DictReader(open("pool.tsv"),delimiter="\t")}
              os.makedirs("audio",exist_ok=True);n=0
              for sid in open("picks.txt").read().split():
                  out="audio/%s.mp3"%sid
                  if os.path.exists(out) or sid not in pool: continue
                  meta=pool[sid];urls=(["https://tatoeba.org/audio/download/"+meta["audio_id"]] if meta["audio_id"] else [])+["https://audio.tatoeba.org/sentences/cmn/%s.mp3"%sid]
                  for u in urls:
                      d=get(u,tries=2)
                      if d and len(d)>1000: open(out,"wb").write(d);n+=1;break
                  time.sleep(0.15)
              print("downloaded",n,flush=True)
          PY
      - name: Commit
        if: always()
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Tatoeba pool/audio" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
