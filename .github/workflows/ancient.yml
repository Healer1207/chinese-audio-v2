name: Fetch ancient character forms
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [chars.txt, .github/workflows/ancient.yml]
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
      - name: Install
        run: python3 -m pip install --quiet opencc-python-reimplemented
      - name: Download oracle/bronze/seal forms from Wikimedia Commons
        working-directory: repo
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse, urllib.error
          import opencc
          cv=opencc.OpenCC('s2t')
          UA={"User-Agent":"hanzi-study/1.0 (personal study; github.com/Healer1207)"}
          chars=open('chars.txt').read().strip()
          extra={'扌':'手','辶':'辵','艹':'艸','纟':'糸','钅':'金','犭':'犬','亻':'人','氵':'水','讠':'言','饣':'食','忄':'心'}
          os.makedirs('ancient',exist_ok=True)
          out={}
          def get(name):
              url="https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(name)
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=60) as r: return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code==404: return None
                      time.sleep(2+i*3)
                  except Exception: time.sleep(2+i*3)
              return None
          for c in chars:
              cands=[]
              for x in [extra.get(c,c), cv.convert(extra.get(c,c)), c]:
                  if x not in cands: cands.append(x)
              got={}
              for form in ['oracle','bronze','seal']:
                  for x in cands:
                      name=f"{x}-{form}.svg"; b=get(name); time.sleep(0.15)
                      if b and b.lstrip().startswith(b'<'):
                          fn=f"ancient/{c}-{form}.svg"; open(fn,'wb').write(b); got[form]=name; break
              if got: out[c]=got
              print(c,got,flush=True)
          json.dump(out,open('ancient/index.json','w'),ensure_ascii=False,indent=0)
          print('chars with forms:',len(out))
          PY
      - name: Commit
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add ancient
          git commit -m "Add ancient character forms from Wikimedia Commons" || echo nothing
          git push
