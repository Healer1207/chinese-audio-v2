name: Fetch ancient character forms
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [chars.txt, .github/workflows/ancient.yml]
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
      - name: Install
        run: python3 -m pip install --quiet opencc-python-reimplemented
      - name: Download oracle/bronze/seal forms from Wikimedia Commons
        working-directory: repo
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse
          import opencc
          cv=opencc.OpenCC('s2t')
          UA={"User-Agent":"HanziStudyBot/1.0 (https://github.com/Healer1207/chinese-audio-v2; personal study)"}
          def get(url):
              for i in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=60) as r: return r.read()
                  except Exception as e:
                      print('retry',url[:90],e,flush=True); time.sleep(5*(i+1))
              return None
          chars=open('chars.txt').read().strip()
          extra={'扌':'手','辶':'辵','艹':'艸','纟':'糸','钅':'金','犭':'犬','亻':'人','氵':'水','讠':'言','饣':'食','忄':'心'}
          cand={}
          for c in chars:
              b=extra.get(c,c); L=[]
              for x in [b, cv.convert(b), c]:
                  if x not in L: L.append(x)
              cand[c]=L
          titles=sorted({f"File:{x}-{f}.svg" for L in cand.values() for x in L for f in ['oracle','bronze','seal']})
          print('titles',len(titles),flush=True)
          urls={}
          for i in range(0,len(titles),50):
              q=urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':'|'.join(titles[i:i+50])})
              d=get('https://commons.wikimedia.org/w/api.php?'+q)
              if not d: continue
              d=json.loads(d)
              norm={n['to']:n['from'] for n in d['query'].get('normalized',[])}
              for pg in d['query']['pages'].values():
                  if 'imageinfo' in pg: urls[norm.get(pg['title'],pg['title'])]=pg['imageinfo'][0]['url']
              time.sleep(1)
          print('found',len(urls),flush=True)
          os.makedirs('ancient',exist_ok=True); out={}
          for c,L in cand.items():
              got={}
              for f in ['oracle','bronze','seal']:
                  for x in L:
                      t=f"File:{x}-{f}.svg"
                      if t in urls:
                          b=get(urls[t]); time.sleep(0.3)
                          if b: open(f"ancient/{c}-{f}.svg",'wb').write(b); got[f]=t
                          break
              if got: out[c]=got
          json.dump(out,open('ancient/index.json','w'),ensure_ascii=False,indent=0)
          print('chars with forms:',len(out))
          PY
      - name: Commit
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add ancient
          git commit -m "Add ancient character forms from Wikimedia Commons" || echo nothing
          git push
